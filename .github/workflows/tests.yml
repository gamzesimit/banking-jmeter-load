name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  jmeter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      parabank:
        image: parasoft/parabank@sha256:4a122c72f653edb979b1b84d98c5c7e938b43f22f9e46d8e041de759390982a4
        ports:
          - 8081:8080
    steps:
      - uses: actions/checkout@v4
      - name: Wait for ParaBank
        run: |
          for i in $(seq 1 40); do
            curl -s -L -o /dev/null --max-time 20 http://localhost:8081/parabank/index.htm || true
            code=$(curl -s -o /dev/null -w "%{http_code}" -H 'Accept: application/json' \
              http://localhost:8081/parabank/services/bank/accounts/12345 || true)
            if [ "$code" = "200" ]; then echo "ready after $i attempts"; exit 0; fi
            sleep 10
          done
          echo "ParaBank did not become ready"; exit 1
      - name: Run the plan
        run: |
          mkdir -p results
          docker run --rm --network host -v "$PWD":/work -w /work justb4/jmeter:5.5 \
            -n -t plans/read-endpoints.jmx -l results/run.jtl \
            -Jhost=localhost -Jport=8081 -Jusers=10 -Jduration=20
      - name: Fail the build on any error
        run: |
          errors=$(awk -F, 'NR>1 && $8=="false"' results/run.jtl | wc -l)
          echo "failed samples: $errors"
          test "$errors" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-results
          path: results/
          retention-days: 14
